<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Main gradient: azul escuro -> azul médio -> verde -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2D5B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E6FD9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:1" />
    </linearGradient>

    <!-- Radial gradient para efeito de profundidade -->
    <radialGradient id="depthGradient" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </radialGradient>

    <!-- Filter para blur suave -->
    <filter id="softBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>

    <!-- Filter para linhas mais suaves -->
    <filter id="lineBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" />
    </filter>
  </defs>

  <!-- Background base com gradiente -->
  <rect width="1920" height="1080" fill="url(#mainGradient)" />

  <!-- Overlay de profundidade -->
  <rect width="1920" height="1080" fill="url(#depthGradient)" />

  <!-- Grupo de elementos tecnológicos - Lado esquerdo superior -->
  <g opacity="0.08" filter="url(#softBlur)">
    <!-- Circuitos/linhas diagonais -->
    <line x1="100" y1="50" x2="400" y2="200" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="150" y1="30" x2="350" y2="180" stroke="#FFFFFF" stroke-width="1" />
    <line x1="200" y1="80" x2="450" y2="250" stroke="#FFFFFF" stroke-width="1.5" />
    
    <!-- Pontos/nós -->
    <circle cx="100" cy="50" r="3" fill="#A3E635" />
    <circle cx="400" cy="200" r="2.5" fill="#22C55E" />
    <circle cx="150" cy="30" r="2" fill="#A3E635" />
    <circle cx="350" cy="180" r="2.5" fill="#22C55E" />
  </g>

  <!-- Grupo de elementos tecnológicos - Lado direito superior -->
  <g opacity="0.07" filter="url(#softBlur)">
    <!-- Grid/linhas de rede -->
    <line x1="1500" y1="100" x2="1800" y2="300" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="1550" y1="80" x2="1850" y2="280" stroke="#FFFFFF" stroke-width="1" />
    <line x1="1600" y1="120" x2="1900" y2="350" stroke="#FFFFFF" stroke-width="1.5" />
    
    <!-- Pontos/nós -->
    <circle cx="1500" cy="100" r="3" fill="#A3E635" />
    <circle cx="1800" cy="300" r="2.5" fill="#22C55E" />
    <circle cx="1550" cy="80" r="2" fill="#A3E635" />
  </g>

  <!-- Partículas/pontos aleatórios distribuídos -->
  <g opacity="0.06" fill="#FFFFFF">
    <!-- Lado esquerdo -->
    <circle cx="250" cy="400" r="1.5" />
    <circle cx="180" cy="550" r="1" />
    <circle cx="320" cy="650" r="1.5" />
    <circle cx="150" cy="750" r="1" />
    <circle cx="380" cy="850" r="1.5" />
    
    <!-- Centro -->
    <circle cx="960" cy="200" r="1" />
    <circle cx="1000" cy="700" r="1.5" />
    <circle cx="900" cy="900" r="1" />
    
    <!-- Lado direito -->
    <circle cx="1650" cy="450" r="1.5" />
    <circle cx="1750" cy="600" r="1" />
    <circle cx="1580" cy="750" r="1.5" />
    <circle cx="1820" cy="850" r="1" />
    <circle cx="1700" cy="950" r="1.5" />
  </g>

  <!-- Linhas horizontais suaves (grid) - muito sutis -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="0.5" filter="url(#lineBlur)">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
  </g>

  <!-- Linhas verticais suaves (grid) - muito sutis -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="0.5" filter="url(#lineBlur)">
    <line x1="320" y1="0" x2="320" y2="1080" />
    <line x1="640" y1="0" x2="640" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1280" y1="0" x2="1280" y2="1080" />
    <line x1="1600" y1="0" x2="1600" y2="1080" />
  </g>

  <!-- Elementos geométricos sutis no canto inferior direito -->
  <g opacity="0.05" filter="url(#softBlur)">
    <!-- Triângulo/forma geométrica -->
    <polygon points="1700,900 1750,1000 1650,1000" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="1700" cy="950" r="4" fill="none" stroke="#A3E635" stroke-width="1" />
  </g>

  <!-- Elementos geométricos sutis no canto superior esquerdo -->
  <g opacity="0.04" filter="url(#softBlur)">
    <!-- Quadrado/forma geométrica -->
    <rect x="80" y="100" width="60" height="60" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="110" cy="130" r="3" fill="#A3E635" />
  </g>
</svg>
